name: Debug Theme

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Reproducir el install.sh de WhiteSur en Kali
        run: |
          docker run --rm kalilinux/kali-rolling bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive USER=root HOME=/root
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              git sassc libglib2.0-dev-bin libglib2.0-dev libxml2-utils \
              libgtk-3-bin gettext imagemagick sudo ca-certificates gnome-shell
            git clone --depth=1 https://github.com/vinceliuice/WhiteSur-gtk-theme.git /tmp/ws
            cd /tmp/ws
            echo "========== INSTALL.SH (salida completa) =========="
            set +e
            ./install.sh -d /usr/share/themes -c Light -c Dark
            echo "========== EXIT=$? =========="
          '
