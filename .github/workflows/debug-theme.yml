name: Debug Theme

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Reproducir el install.sh de WhiteSur en Kali
        run: |
          docker run --rm kalilinux/kali-rolling bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive USER=root HOME=/root
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              git sassc libglib2.0-dev-bin libglib2.0-dev libxml2-utils \
              libgtk-3-bin gettext imagemagick sudo ca-certificates
            git clone --depth=1 https://github.com/vinceliuice/WhiteSur-gtk-theme.git /tmp/ws
            cd /tmp/ws
            set +e
            echo "========== Neutralizando set -Eeo pipefail para ver el error real =========="
            grep -rl "set -Eeo pipefail" . | xargs sed -i "s/set -Eeo pipefail/set +e/g"
            echo "========== INSTALL.SH (modo no estricto) =========="
            ./install.sh -d /usr/share/themes -c Light -c Dark 2>&1 | tail -50
            echo "========== EXIT=${PIPESTATUS[0]} =========="
            echo "----- temas WhiteSur instalados -----"
            ls /usr/share/themes/ | grep -i whitesur || echo "NINGUNO"
          '
