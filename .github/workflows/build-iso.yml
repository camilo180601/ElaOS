name: Build ISO

on:
  workflow_dispatch:
    inputs:
      kali_meta:
        description: "Arsenal Kali (top10 / default / everything)"
        type: choice
        default: kali-tools-top10
        options:
          - kali-tools-top10
          - kali-linux-default
          - kali-linux-everything
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ISO ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/local/share/boost || true
          # Mover el almacenamiento de Docker a /mnt (mucho más grande)
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          df -h

      - name: Construir la ISO
        env:
          ELAOS_KALI_META: ${{ github.event.inputs.kali_meta || 'kali-tools-top10' }}
        run: ./build.sh ${{ matrix.arch }}

      - name: Renombrar la ISO
        run: |
          iso="$(ls *.iso | head -n1)"
          mv "$iso" "ElaOS-${{ matrix.arch }}.iso"
          sha256sum "ElaOS-${{ matrix.arch }}.iso" > "ElaOS-${{ matrix.arch }}.iso.sha256"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ElaOS-${{ matrix.arch }}
          path: |
            ElaOS-${{ matrix.arch }}.iso
            ElaOS-${{ matrix.arch }}.iso.sha256
          retention-days: 7
          compression-level: 0

      - name: Publicar en Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ElaOS-${{ matrix.arch }}.iso
            ElaOS-${{ matrix.arch }}.iso.sha256
